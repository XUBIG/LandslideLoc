[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-localization"
version = "1.0.0"
description = "Reproducible two-stage landslide localization and Direct LLM comparison"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Bing Xu"}]

[tool.setuptools.packages.find]
where = ["src"]
